server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: paciente-service
          uri: lb://PACIENTE-SERVICE
          predicates:
            - Path=/api/pacientes/**
        - id: cita-service
          uri: lb://CITA-SERVICE
          predicates:
            - Path=/api/citas/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/